<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習導覽頁面</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 sm:text-2xl">自主學習導覽網</h1>
                    <p class="text-xs text-slate-500 font-medium hidden sm:block">點選下方單元，開始快樂學習！</p>
                </div>
            </div>
            <div class="bg-indigo-50 text-indigo-700 text-sm font-semibold px-4 py-2 rounded-full border border-indigo-100 flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                <span>今日課程</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <section class="mb-12">
            <div class="flex items-center space-x-3 mb-6 border-b border-slate-200 pb-3">
                <span class="w-1.5 h-7 bg-amber-500 rounded-full"></span>
                <h2 class="text-2xl font-bold text-slate-900 flex items-center">
                    <i class="fa-solid fa-calculator text-amber-500 mr-2.5"></i>數學領域
                </h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <div class="bg-white rounded-2xl border-2 border-slate-100 shadow-xs hover:shadow-xl hover:border-indigo-200 transition-all duration-300 overflow-hidden flex flex-col group">
                    <div class="p-6 flex-1">
                        <div class="flex items-start justify-between mb-4">
                            <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 group-hover:scale-110 transition-transform duration-300">
                                <i class="fa-solid fa-divide text-2xl"></i>
                            </div>
                            <span class="bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-100">
                                <i class="fa-solid fa-circle-check mr-1"></i>已開放
                            </span>
                        </div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2">基礎除法與應用</h3>
                        <p class="text-slate-500 text-base leading-relaxed mb-6">包含均分概念、九九乘法逆運算、有餘數的除法直式計算與生活應用題。</p>
                        
                        <div class="space-y-2.5 border-t border-slate-100 pt-4">
                            <p class="text-sm font-bold text-slate-400 mb-2 tracking-wider">請選擇練習單元：</p>
                            
                            <button onclick="navigateTo('div1.html')" class="w-full text-left bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-between group/btn border border-slate-100 hover:border-indigo-100 cursor-pointer min-h-[48px]">
                                <span class="flex items-center"><i class="fa-solid fa-file-lines mr-2.5 text-slate-400 group-hover/btn:text-indigo-500"></i>除法應用題 1</span>
                                <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover/btn:opacity-100 translate-x-[-4px] group-hover/btn:translate-x-0 transition-all"></i>
                            </button>

                            <button onclick="navigateTo('div2.html')" class="w-full text-left bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-between group/btn border border-slate-100 hover:border-indigo-100 cursor-pointer min-h-[48px]">
                                <span class="flex items-center"><i class="fa-solid fa-file-lines mr-2.5 text-slate-400 group-hover/btn:text-indigo-500"></i>除法應用題 2</span>
                                <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover/btn:opacity-100 translate-x-[-4px] group-hover/btn:translate-x-0 transition-all"></i>
                            </button>

                             <button onclick="navigateTo('div3.html')" class="w-full text-left bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-between group/btn border border-slate-100 hover:border-indigo-100 cursor-pointer min-h-[48px]">
                                <span class="flex items-center"><i class="fa-solid fa-file-lines mr-2.5 text-slate-400 group-hover/btn:text-indigo-500"></i>除法應用題 3</span>
                                <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover/btn:opacity-100 translate-x-[-4px] group-hover/btn:translate-x-0 transition-all"></i>
                            </button>

                             <button onclick="navigateTo('div4_auto.html')" class="w-full text-left bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-between group/btn border border-slate-100 hover:border-indigo-100 cursor-pointer min-h-[48px]">
                                <span class="flex items-center"><i class="fa-solid fa-file-lines mr-2.5 text-slate-400 group-hover/btn:text-indigo-500"></i>114-2第三次段考</span>
                                <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover/btn:opacity-100 translate-x-[-4px] group-hover/btn:translate-x-0 transition-all"></i>
                            </button>

                             <button onclick="navigateTo('div5.html')" class="w-full text-left bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-between group/btn border border-slate-100 hover:border-indigo-100 cursor-pointer min-h-[48px]">
                                <span class="flex items-center"><i class="fa-solid fa-file-lines mr-2.5 text-slate-400 group-hover/btn:text-indigo-500"></i>除法應用題 5</span>
                                <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover/btn:opacity-100 translate-x-[-4px] group-hover/btn:translate-x-0 transition-all"></i>
                            </button>

                        </div>
                    </div>
                </div>
                </div>
        </section>

        
        </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-400 font-medium">
            &copy; 2026 數位教學資源網. All New UI Design.
        </div>
    </footer>

    <script>
        function navigateTo(pageName) {
            window.location.href = pageName;
        }
    </script>
</body>
</html>
