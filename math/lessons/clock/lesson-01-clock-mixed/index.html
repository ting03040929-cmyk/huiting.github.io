<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>認識整點與半點｜混合練習｜數學學習站</title>
  <style>
    :root {
      --ink: #172b4d;
      --muted: #5f7085;
      --blue: #246fce;
      --blue-dark: #174d94;
      --blue-soft: #eaf4ff;
      --orange: #d9791f;
      --orange-soft: #fff3e5;
      --green: #218b78;
      --green-soft: #e8f7f2;
      --red: #bd4b4b;
      --red-soft: #fff0f0;
      --line: #d7e1eb;
      --surface: #ffffff;
      --page: #f5f9fc;
      --shadow: 0 12px 30px rgba(36, 75, 112, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: linear-gradient(180deg, #f2f8fd 0%, var(--page) 42%, #ffffff 100%);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      line-height: 1.5;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 4px solid rgba(36, 111, 206, 0.28);
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .app-shell {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 4px 2px 18px;
      border-bottom: 3px solid var(--blue);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--blue);
      font-size: 1rem;
      font-weight: 700;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 4px;
      font-size: clamp(1.55rem, 4vw, 2.35rem);
      line-height: 1.2;
    }

    .top-note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: right;
    }

    main { padding-top: 24px; }

    .intro {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }

    .intro h2 {
      margin-bottom: 8px;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
    }

    .intro p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .rule-hint {
      display: inline-block;
      margin-top: 16px;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      max-width: 920px;
      margin: 28px auto 0;
    }

    .mode-card {
      min-height: 180px;
      padding: 22px;
      border: 2px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--ink);
      text-align: left;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .mode-card:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      box-shadow: 0 16px 34px rgba(36, 111, 206, 0.16);
    }

    .mode-card.whole { border-top: 8px solid var(--blue); }
    .mode-card.half { border-top: 8px solid var(--green); }
    .mode-card.mixed { border-top: 8px solid var(--orange); }

    .mode-icon {
      display: block;
      margin-bottom: 8px;
      font-size: 2rem;
    }

    .mode-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1.35rem;
    }

    .mode-card span:last-child {
      color: var(--muted);
      font-size: 1rem;
    }

    .teacher-note {
      max-width: 760px;
      margin: 22px auto 0;
      padding: 14px 18px;
      border-left: 5px solid var(--orange);
      background: var(--orange-soft);
      color: #744713;
    }

    .practice-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .small-button,
    .secondary-button {
      min-height: 44px;
      padding: 8px 15px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 700;
    }

    .small-button:hover,
    .secondary-button:hover { border-color: var(--blue); }

    .mode-badge {
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: var(--orange);
      font-weight: 700;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      min-width: min(330px, 42%);
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .progress-track {
      height: 12px;
      flex: 1;
      overflow: hidden;
      border-radius: 999px;
      background: #e4edf5;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green));
      transition: width 200ms ease;
    }

    .question-card,
    .result-card {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .question-head {
      text-align: center;
    }

    .question-number {
      margin-bottom: 4px;
      color: var(--orange);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .question-head h2 {
      margin-bottom: 6px;
      font-size: clamp(1.35rem, 3.5vw, 1.9rem);
    }

    .question-prompt {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .clock-stage {
      width: min(360px, 80vw);
      margin: 0 auto 18px;
      padding: 12px;
      border: 2px solid #dce7f0;
      border-radius: 22px;
      background: #fbfdff;
    }

    .clock-image {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      background: #ffffff;
    }

    .clock-image svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .hint-text {
      flex-basis: 100%;
      margin: 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      text-align: center;
      font-weight: 700;
    }

    .answer-label {
      margin-bottom: 10px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 680px;
      margin: 0 auto;
    }

    .option-button {
      min-height: 72px;
      padding: 10px 8px;
      border: 2px solid #c8d7e5;
      border-radius: 16px;
      background: #fafdff;
      color: var(--ink);
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    .option-button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .option-button.is-wrong {
      border-color: var(--red);
      background: var(--red-soft);
      color: var(--red);
    }

    .option-button.is-correct {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }

    .option-button:disabled { cursor: default; }

    .feedback {
      min-height: 34px;
      margin: 16px 0 0;
      text-align: center;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .feedback.success { color: var(--green); }
    .feedback.try-again { color: var(--red); }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    .primary-button {
      min-width: 150px;
      min-height: 50px;
      padding: 10px 22px;
      border: 0;
      border-radius: 14px;
      background: var(--blue);
      color: #ffffff;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .primary-button:hover:not(:disabled) { background: var(--blue-dark); }
    .primary-button:disabled { cursor: not-allowed; opacity: 0.42; }

    .result-card { text-align: center; }

    .result-card h2 {
      margin-bottom: 6px;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
    }

    .score {
      margin: 18px 0 8px;
      color: var(--blue);
      font-size: clamp(3.2rem, 12vw, 5.5rem);
      font-weight: 700;
      line-height: 1;
    }

    .result-message {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 680px) {
      .app-shell { width: min(100% - 22px, 560px); padding-top: 14px; }
      .topbar { display: block; }
      .top-note { text-align: left; }
      .mode-grid { grid-template-columns: 1fr; }
      .practice-top { flex-wrap: wrap; }
      .progress-wrap { flex-basis: 100%; min-width: 100%; margin-left: 0; }
      .question-card, .result-card { padding: 18px 14px; border-radius: 20px; }
      .option-grid { grid-template-columns: 1fr; max-width: 430px; }
      .option-button { min-height: 62px; }
    }

    @media (min-width: 681px) and (max-width: 820px) {
      .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">第二學期數學</p>
        <h1>認識整點與半點</h1>
        <p class="top-note">混合練習｜題目順序打散</p>
      </div>
      <p class="top-note">先看長針，再看短針</p>
    </header>

    <main>
      <section id="homeScreen" class="screen">
        <div class="intro">
          <h2>選一種練習開始</h2>
          <p>每一題會出現一個鐘面。看清楚，再選出時間。</p>
          <span class="rule-hint">每種練習都有 12 題</span>
        </div>

        <div class="mode-grid" aria-label="練習種類">
          <button class="mode-card whole" type="button" data-mode="whole">
            <span class="mode-icon" aria-hidden="true">🕛</span>
            <strong>整點混合</strong>
            <span>分針指向 12，再看是幾點。</span>
          </button>
          <button class="mode-card half" type="button" data-mode="half">
            <span class="mode-icon" aria-hidden="true">🕧</span>
            <strong>半點混合</strong>
            <span>分針指向 6，再看是幾點半。</span>
          </button>
          <button class="mode-card mixed" type="button" data-mode="mixed">
            <span class="mode-icon" aria-hidden="true">🕒</span>
            <strong>整點＋半點混合</strong>
            <span>有些是整點，有些是半點。一起練習。</span>
          </button>
        </div>

        <p class="teacher-note"><strong>小提醒：</strong>如果看不清楚，可以按「提示」。答錯時可以再選一次。</p>
      </section>

      <section id="practiceScreen" class="screen" hidden>
        <div class="practice-top">
          <button id="backButton" class="small-button" type="button">回到選擇</button>
          <span id="modeBadge" class="mode-badge">整點混合</span>
          <div class="progress-wrap" aria-label="作答進度">
            <span id="progressText">第 1 / 12 題</span>
            <div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
          </div>
        </div>

        <article class="question-card">
          <div class="question-head">
            <p id="questionNumber" class="question-number">第 1 題</p>
            <h2>看鐘面，選出時間</h2>
            <p id="questionPrompt" class="question-prompt">先看藍色長針，再看紅色短針。</p>
          </div>

          <div class="clock-stage">
            <div id="clockImage" class="clock-image" role="img" aria-label="鐘面"></div>
          </div>

          <div class="hint-row">
            <button id="hintButton" class="secondary-button" type="button" aria-expanded="false">提示</button>
            <p id="hintText" class="hint-text" hidden></p>
          </div>

          <p class="answer-label">請選擇答案</p>
          <div id="optionGrid" class="option-grid" role="group" aria-label="時間選項"></div>
          <p id="feedback" class="feedback" aria-live="polite"></p>

          <div class="action-row">
            <button id="nextButton" class="primary-button" type="button" disabled>下一題</button>
          </div>
        </article>
      </section>

      <section id="resultScreen" class="screen" hidden>
        <div class="result-card">
          <h2 id="resultTitle">完成練習！</h2>
          <p id="scoreText" class="score">0 / 12</p>
          <p id="resultMessage" class="result-message">你完成了這一回合。</p>
          <div class="result-actions">
            <button id="retryButton" class="primary-button" type="button">再做一次</button>
            <button id="switchButton" class="secondary-button" type="button">換另一種練習</button>
          </div>
        </div>
      </section>
    </main>

    <footer>數學學習站｜認識整點與半點互動練習</footer>
  </div>

  <script>
    const imageFolder = "assets/";
    const modes = {
      whole: {
        name: "整點混合",
        kind: "whole",
        prompt: "先看藍色長針，再看紅色短針。",
        hint: "藍色長針指向 12，就是整點；再看紅色短針指向幾。",
        unit: "點",
        hours: [1, 12, 9, 4, 7, 2, 11, 5, 8, 3, 10, 6],
        file: (hour) => `${hour}點 (0).JPG`,
        label: (hour) => `${hour}點`
      },
      half: {
        name: "半點混合",
        kind: "half",
        prompt: "分針指向 6，請說出是幾點半。",
        hint: "藍色長針指向 6，就是半點；再看紅色短針的位置。",
        unit: "點半",
        hours: [3, 12, 6, 1, 10, 4, 8, 2, 11, 5, 9, 7],
        file: (hour) => `${hour}點 (30).JPG`,
        label: (hour) => `${hour}點半`
      },
      mixed: {
        name: "整點＋半點混合",
        prompt: "有些是整點，有些是半點。先看藍色長針，再看紅色短針。",
        hint: "長針指向 12 是整點；長針指向 6 是半點。",
        items: [
          { kind: "whole", hour: 1 },
          { kind: "half", hour: 3 },
          { kind: "whole", hour: 12 },
          { kind: "half", hour: 6 },
          { kind: "whole", hour: 9 },
          { kind: "half", hour: 1 },
          { kind: "whole", hour: 4 },
          { kind: "half", hour: 10 },
          { kind: "whole", hour: 7 },
          { kind: "half", hour: 4 },
          { kind: "whole", hour: 2 },
          { kind: "half", hour: 8 }
        ]
      }
    };

    const state = {
      modeKey: null,
      questions: [],
      index: 0,
      score: 0,
      answeredCorrectly: false
    };

    const homeScreen = document.getElementById("homeScreen");
    const practiceScreen = document.getElementById("practiceScreen");
    const resultScreen = document.getElementById("resultScreen");
    const modeBadge = document.getElementById("modeBadge");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const questionNumber = document.getElementById("questionNumber");
    const questionPrompt = document.getElementById("questionPrompt");
    const clockImage = document.getElementById("clockImage");
    const optionGrid = document.getElementById("optionGrid");
    const feedback = document.getElementById("feedback");
    const hintButton = document.getElementById("hintButton");
    const hintText = document.getElementById("hintText");
    const nextButton = document.getElementById("nextButton");

    function assetPath(fileName) {
      return imageFolder + encodeURIComponent(fileName);
    }

    function renderClock(container, hour, kind) {
      const isHalf = kind === "half";
      const minuteAngle = isHalf ? 180 : 0;
      const hourAngle = (hour % 12) * 30 + (isHalf ? 15 : 0);
      const point = (angle, length) => {
        const radians = angle * Math.PI / 180;
        return {
          x: 150 + length * Math.sin(radians),
          y: 150 - length * Math.cos(radians)
        };
      };
      const minutePoint = point(minuteAngle, 101);
      const hourPoint = point(hourAngle, 68);
      const ticks = Array.from({ length: 12 }, (_, index) => (
        `<line x1="150" y1="25" x2="150" y2="39" stroke="#17324d" stroke-width="4" stroke-linecap="round" transform="rotate(${index * 30} 150 150)" />`
      )).join("");
      const numbers = Array.from({ length: 12 }, (_, index) => {
        const value = index === 0 ? 12 : index;
        const angle = index * 30 * Math.PI / 180 - Math.PI / 2;
        const x = 150 + 91 * Math.cos(angle);
        const y = 150 + 91 * Math.sin(angle) + 7;
        return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="21" font-weight="800" fill="#17324d">${value}</text>`;
      }).join("");

      container.innerHTML = `
        <svg viewBox="0 0 300 300" role="img" aria-label="鐘面">
          <title>鐘面</title>
          <circle cx="150" cy="150" r="130" fill="#ffffff" stroke="#17324d" stroke-width="5" />
          ${ticks}
          ${numbers}
          <line x1="150" y1="150" x2="${hourPoint.x.toFixed(1)}" y2="${hourPoint.y.toFixed(1)}" stroke="#bd4b4b" stroke-width="11" stroke-linecap="round" />
          <line x1="150" y1="150" x2="${minutePoint.x.toFixed(1)}" y2="${minutePoint.y.toFixed(1)}" stroke="#246fce" stroke-width="8" stroke-linecap="round" />
          <circle cx="150" cy="150" r="10" fill="#17324d" />
        </svg>`;
    }

    function shuffled(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function makeQuestions(mode) {
      if (mode.items) {
        return mode.items.map(({ kind, hour }) => ({
          kind,
          hour,
          label: kind === "half" ? `${hour}點半` : `${hour}點`,
          file: `${hour}點 (${kind === "half" ? "30" : "0"}).JPG`
        }));
      }

      return mode.hours.map((hour) => ({
        kind: mode.kind,
        hour,
        label: mode.label(hour),
        file: mode.file(hour)
      }));
    }

    function makeOptions(question) {
      const previous = question.hour === 1 ? 12 : question.hour - 1;
      const next = question.hour === 12 ? 1 : question.hour + 1;
      const label = (value) => question.kind === "half" ? `${value}點半` : `${value}點`;
      return shuffled([question.hour, previous, next]).map(label);
    }

    function startMode(modeKey) {
      state.modeKey = modeKey;
      state.questions = makeQuestions(modes[modeKey]);
      state.index = 0;
      state.score = 0;
      state.answeredCorrectly = false;
      homeScreen.hidden = true;
      resultScreen.hidden = true;
      practiceScreen.hidden = false;
      renderQuestion();
    }

    function renderQuestion() {
      const mode = modes[state.modeKey];
      const question = state.questions[state.index];
      state.answeredCorrectly = false;

      modeBadge.textContent = mode.name;
      progressText.textContent = `第 ${state.index + 1} / ${state.questions.length} 題`;
      progressFill.style.width = `${(state.index / state.questions.length) * 100}%`;
      questionNumber.textContent = `第 ${state.index + 1} 題`;
      questionPrompt.textContent = mode.prompt;
      renderClock(clockImage, question.hour, question.kind);
      clockImage.setAttribute("aria-label", `鐘面：${question.label}`);
      hintText.textContent = mode.hint;
      hintText.hidden = true;
      hintButton.setAttribute("aria-expanded", "false");
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.disabled = true;
      nextButton.textContent = state.index === state.questions.length - 1 ? "看結果" : "下一題";

      optionGrid.innerHTML = "";
      makeOptions(question).forEach((label) => {
        const option = document.createElement("button");
        option.type = "button";
        option.className = "option-button";
        option.textContent = label;
        option.setAttribute("aria-label", `選擇 ${label}`);
        option.addEventListener("click", () => chooseAnswer(label, option));
        optionGrid.appendChild(option);
      });
    }

    function chooseAnswer(label, selectedButton) {
      if (state.answeredCorrectly) return;

      const mode = modes[state.modeKey];
      const question = state.questions[state.index];
      optionGrid.querySelectorAll("button").forEach((button) => {
        button.classList.remove("is-wrong", "is-correct");
      });

      if (label === question.label) {
        selectedButton.classList.add("is-correct");
        state.answeredCorrectly = true;
        state.score += 1;
        feedback.textContent = "答對了！可以進入下一題。";
        feedback.className = "feedback success";
        nextButton.disabled = false;
        optionGrid.querySelectorAll("button").forEach((button) => {
          button.disabled = true;
        });
      } else {
        selectedButton.classList.add("is-wrong");
        feedback.textContent = `再看一次鐘面。${mode.prompt}`;
        feedback.className = "feedback try-again";
      }
    }

    function showResult() {
      practiceScreen.hidden = true;
      resultScreen.hidden = false;
      const total = state.questions.length;
      document.getElementById("scoreText").textContent = `${state.score} / ${total}`;
      const message = state.score === total
        ? "太棒了！你全部答對了。"
        : state.score >= 9
          ? "做得很好！再練習一次，會更熟悉。"
          : "你完成了練習。再看長針和短針的位置。";
      document.getElementById("resultMessage").textContent = message;
    }

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => startMode(button.dataset.mode));
    });

    document.getElementById("backButton").addEventListener("click", () => {
      practiceScreen.hidden = true;
      homeScreen.hidden = false;
    });

    hintButton.addEventListener("click", () => {
      const willShow = hintText.hidden;
      hintText.hidden = !willShow;
      hintButton.setAttribute("aria-expanded", String(willShow));
    });

    nextButton.addEventListener("click", () => {
      if (!state.answeredCorrectly) return;
      if (state.index < state.questions.length - 1) {
        state.index += 1;
        renderQuestion();
      } else {
        showResult();
      }
    });

    document.getElementById("retryButton").addEventListener("click", () => {
      startMode(state.modeKey);
    });

    document.getElementById("switchButton").addEventListener("click", () => {
      const nextMode = { whole: "half", half: "mixed", mixed: "whole" }[state.modeKey];
      startMode(nextMode);
    });
  </script>
</body>
</html>
