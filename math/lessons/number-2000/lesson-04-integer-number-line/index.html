<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf0f3">
  <title>整數數線｜網頁簡報</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#slideStage">跳到簡報內容</a>
  <header class="presenter-bar">
    <div class="brand" aria-label="數學網頁簡報">
      <span class="brand-mark" aria-hidden="true">線</span>
      <div><strong>整數數線</strong><small>2000 以內的數｜國中特教版</small></div>
    </div>
    <div class="presenter-actions">
      <button id="resetSlide" type="button">重新開始本頁</button>
      <button id="speakSlide" type="button">朗讀本頁</button>
      <button id="fullscreen" type="button">全螢幕</button>
    </div>
  </header>

  <main class="deck-shell">
    <section class="slide-stage" id="slideStage" tabindex="-1" aria-live="polite"></section>
  </main>

  <footer class="slide-controls">
    <button class="nav-button" id="previous" type="button">上一頁</button>
    <div class="slide-position">
      <span id="pageLabel">第 1 頁</span>
      <span class="score-label" id="scoreLabel">已完成 0 個任務</span>
      <div class="progress-dots" id="progressDots" aria-label="學習進度"></div>
    </div>
    <button class="nav-button primary" id="next" type="button">下一頁</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
