<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>積木數數定位板</title>
  <style>
    :root {
      --ink: #24324a;
      --muted: #64748b;
      --line: #cbd5e1;
      --panel: #ffffff;
      --page: #eef3f9;
      --primary: #4f46e5;
      --success: #047857;
      --danger: #be123c;
      --thousand: #8b5cf6;
      --hundred: #3b82f6;
      --ten: #f97316;
      --one: #f8fafc;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background: var(--page);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .app { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 178px; }
    main { min-width: 0; padding: 18px; }
    .topbar { display: flex; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(1.35rem, 2.4vw, 2rem); }
    .mode-switch { display: flex; flex-wrap: wrap; gap: 6px; padding: 5px; background: #dfe7f2; border-radius: 13px; }
    .mode-btn, .action-btn {
      min-height: 44px; border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 800;
      color: #475569; background: transparent; cursor: pointer;
    }
    .mode-btn.active { color: #fff; background: var(--primary); box-shadow: 0 3px 10px #4f46e540; }

    .challenge-panel {
      display: none; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 14px; margin-bottom: 14px; border: 2px solid #c7d2fe;
      border-radius: 15px; background: #eef2ff;
    }
    .challenge-panel.show { display: flex; }
    .challenge-panel strong { font-size: 1.05rem; }
    .teacher-controls, .self-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .self-controls { display: none; }
    .self-mode .teacher-controls { display: none; }
    .self-mode .self-controls { display: flex; }
    .self-progress { min-width: 150px; }
    .progress-text { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; color: #3730a3; font-weight: 900; }
    .progress-track { width: 100%; height: 12px; overflow: hidden; border-radius: 999px; background: #c7d2fe; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #4f46e5, #8b5cf6); transition: width .35s ease; }
    .hidden { display: none !important; }
    .target-number { color: #3730a3; font-size: 2rem; font-weight: 900; letter-spacing: .08em; min-width: 94px; text-align: center; }
    .question-input { width: 120px; min-height: 44px; border: 2px solid #a5b4fc; border-radius: 10px; padding: 6px 10px; font-size: 1.15rem; font-weight: 800; text-align: center; }
    .primary { color: #fff; background: var(--primary); }
    .secondary { color: #3730a3; background: #fff; border: 2px solid #c7d2fe; }
    .check { color: #fff; background: var(--success); }

    .workspace {
      position: relative; height: clamp(300px, 45vh, 520px); overflow: hidden;
      border: 4px dashed var(--line); border-radius: 20px; background: #fff;
      box-shadow: inset 0 2px 10px #33415512;
      touch-action: none;
    }
    .empty-hint {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
      color: #94a3b8; font-size: clamp(1rem, 2vw, 1.3rem); font-weight: 700; text-align: center;
      pointer-events: none;
    }
    .board-block { position: absolute; display: grid; place-items: center; cursor: grab; touch-action: none; z-index: 2; }
    .board-block.dragging { cursor: grabbing; z-index: 20; filter: drop-shadow(0 8px 8px #33415555); }
    .block-shape { pointer-events: none; }

    .shape-1000, .shape-100 {
      width: 92px; height: 92px; border: 2px solid;
      background-size: 9px 9px;
    }
    .shape-1000 {
      border-color: #7e22ce; background-color: #c084fc;
      background-image: linear-gradient(to right, #9333ea 1px, transparent 1px), linear-gradient(to bottom, #9333ea 1px, transparent 1px);
      box-shadow: 14px 14px 0 #7e22ce, 17px 18px 10px #33415544;
      transform: translate(-7px, -7px);
    }
    .shape-100 { border-color: #2563eb; background-color: #60a5fa; background-image: linear-gradient(to right, #2563eb 1px, transparent 1px), linear-gradient(to bottom, #2563eb 1px, transparent 1px); }
    .shape-10 { width: 13px; height: 92px; border: 2px solid #c2410c; background-color: #fb923c; background-image: linear-gradient(to bottom, #c2410c 1px, transparent 1px); background-size: 10px 9px; }
    .shape-1 { width: 18px; height: 18px; border: 2px solid #64748b; background: var(--one); }

    .summary { margin-top: 14px; padding: 14px; border-radius: 18px; background: var(--panel); box-shadow: 0 5px 16px #33415518; }
    .summary-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .summary-head h2 { margin: 0; font-size: 1.1rem; }
    .live-number { color: var(--primary); font-size: clamp(1.5rem, 4vw, 2.4rem); font-weight: 900; letter-spacing: .08em; }
    .place-board { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid #334155; border-radius: 13px; overflow: hidden; }
    .place-cell { min-width: 0; text-align: center; border-right: 2px solid #334155; background: #f8fafc; }
    .place-cell:last-child { border-right: 0; }
    .place-label { padding: 7px 3px; font-weight: 900; border-bottom: 2px solid #334155; }
    .place-cell:nth-child(1) .place-label { color: #6d28d9; background: #f3e8ff; }
    .place-cell:nth-child(2) .place-label { color: #1d4ed8; background: #dbeafe; }
    .place-cell:nth-child(3) .place-label { color: #c2410c; background: #ffedd5; }
    .place-cell:nth-child(4) .place-label { color: #334155; background: #e2e8f0; }
    .place-value { display: grid; place-items: center; min-height: 76px; font-size: 2rem; font-weight: 900; }
    .target-digit { display: none; color: #3730a3; font-size: 2.15rem; line-height: 1; }
    .challenge-mode .target-digit { display: block; }
    .challenge-mode .built-digit { margin-top: 5px; color: var(--muted); font-size: .85rem; font-weight: 700; }
    .feedback { min-height: 30px; margin-top: 10px; font-size: 1.1rem; font-weight: 900; text-align: center; }
    .feedback.success { color: var(--success); }
    .feedback.try { color: var(--danger); }

    aside { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: #fff; border-left: 2px solid #dbe3ee; box-shadow: -5px 0 15px #33415512; }
    .tool-head { padding: 14px 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    .tool-head h2 { margin: 0 0 9px; font-size: 1.05rem; }
    .reset { width: 100%; min-height: 40px; border: 1px solid #fecaca; border-radius: 10px; color: #b91c1c; background: #fee2e2; font-weight: 800; cursor: pointer; }
    .palette { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 16px 8px 24px; }
    .palette-item { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 100%; cursor: grab; touch-action: none; }
    .palette-item:active { cursor: grabbing; }
    .chip { min-width: 42px; padding: 3px 8px; border: 1px solid #cbd5e1; border-radius: 999px; background: #f8fafc; font-size: .8rem; font-weight: 900; text-align: center; }
    .palette-hit { min-width: 48px; min-height: 48px; display: grid; place-items: center; }
    .palette-item .shape-1000, .palette-item .shape-100 { transform: scale(.82); }
    .palette-item .shape-1000 { transform: translate(-7px, -7px) scale(.82); }
    .ghost { position: fixed; z-index: 999; pointer-events: none; opacity: .8; transform: translate(-50%, -50%); filter: drop-shadow(0 8px 8px #33415566); }
    .tip { margin-top: auto; padding: 10px; color: var(--muted); background: #f8fafc; border-top: 1px solid #e2e8f0; font-size: .74rem; line-height: 1.45; text-align: center; }

    @media (max-width: 720px) {
      .app { grid-template-columns: minmax(0, 1fr) 112px; }
      main { padding: 10px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .workspace { height: 350px; }
      .palette { gap: 14px; }
      .palette-item .shape-1000, .palette-item .shape-100 { transform: scale(.62); }
      .palette-item .shape-1000 { transform: translate(-7px, -7px) scale(.62); }
      .place-value { min-height: 62px; font-size: 1.55rem; }
      .place-label { font-size: .88rem; }
      .action-btn { padding: 8px 11px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <main>
      <div class="topbar">
        <h1>🧮 積木數數定位板</h1>
        <div class="mode-switch" role="group" aria-label="選擇活動模式">
          <button class="mode-btn active" data-mode="explore">自由操作</button>
          <button class="mode-btn" data-mode="challenge">出題挑戰</button>
          <button class="mode-btn" data-mode="self">自我挑戰</button>
        </div>
      </div>

      <section class="challenge-panel" id="challengePanel" aria-label="出題設定">
        <strong id="promptLead">請用積木排出：</strong>
        <span class="target-number" id="targetNumber">—</span>
        <div class="teacher-controls">
          <input class="question-input" id="questionInput" type="number" min="0" max="9999" inputmode="numeric" placeholder="0～9999" aria-label="輸入題目數字">
          <button class="action-btn secondary" id="setQuestion">指定題目</button>
          <button class="action-btn secondary" id="randomQuestion">隨機出題</button>
        </div>
        <div class="self-controls">
          <div class="self-progress" aria-label="自我挑戰進度">
            <div class="progress-text"><span id="selfProgressText">第 1／5 題</span><span id="selfAttempts">嘗試 0 次</span></div>
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
          </div>
          <button class="action-btn secondary" id="restartSelf">重新挑戰</button>
        </div>
        <button class="action-btn check" id="checkAnswer">檢查答案</button>
        <button class="action-btn primary hidden" id="nextSelfQuestion">下一題 →</button>
      </section>

      <section class="workspace" id="workspace" aria-label="積木操作區">
        <div class="empty-hint" id="emptyHint">從右側拖曳積木到這裡<br>也可以輕點積木快速加入</div>
      </section>

      <section class="summary" id="summary">
        <div class="summary-head">
          <h2 id="summaryTitle">積木代表的數字</h2>
          <div class="live-number" id="liveNumber" aria-live="polite">0</div>
        </div>
        <div class="place-board" aria-label="千位定位板">
          <div class="place-cell"><div class="place-label">千位</div><div class="place-value"><span class="target-digit" data-target="1000">0</span><span class="built-digit" data-built="1000">0 個千</span></div></div>
          <div class="place-cell"><div class="place-label">百位</div><div class="place-value"><span class="target-digit" data-target="100">0</span><span class="built-digit" data-built="100">0 個百</span></div></div>
          <div class="place-cell"><div class="place-label">十位</div><div class="place-value"><span class="target-digit" data-target="10">0</span><span class="built-digit" data-built="10">0 個十</span></div></div>
          <div class="place-cell"><div class="place-label">個位</div><div class="place-value"><span class="target-digit" data-target="1">0</span><span class="built-digit" data-built="1">0 個一</span></div></div>
        </div>
        <div class="feedback" id="feedback" aria-live="assertive"></div>
      </section>
    </main>

    <aside aria-label="積木工具列">
      <div class="tool-head">
        <h2>積木工具列</h2>
        <button class="reset" id="resetBlocks">↶ 清除積木</button>
      </div>
      <div class="palette" id="palette"></div>
      <div class="tip">拖回工具列可移除積木<br>每一種最多放 9 個</div>
    </aside>
  </div>

  <script>
    const TYPES = ['1000', '100', '10', '1'];
    const DEFS = {
      '1000': { value: 1000, label: '千', w: 106, h: 106 },
      '100': { value: 100, label: '百', w: 96, h: 96 },
      '10': { value: 10, label: '十', w: 48, h: 96 },
      '1': { value: 1, label: '一', w: 48, h: 48 }
    };

    const state = {
      blocks: [], mode: 'explore', target: null, drag: null, nextId: 1,
      selfQuestions: [], selfIndex: 0, selfAttempts: 0, selfAnswered: false
    };
    const app = document.getElementById('app');
    const workspace = document.getElementById('workspace');
    const palette = document.getElementById('palette');
    const feedback = document.getElementById('feedback');

    function shape(type) {
      const el = document.createElement('div');
      el.className = `block-shape shape-${type}`;
      return el;
    }

    function buildPalette() {
      TYPES.forEach(type => {
        const item = document.createElement('div');
        item.className = 'palette-item';
        item.dataset.type = type;
        item.setAttribute('role', 'button');
        item.setAttribute('tabindex', '0');
        item.setAttribute('aria-label', `加入一個${DEFS[type].label}位積木，代表 ${type}`);
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = type;
        const hit = document.createElement('div');
        hit.className = 'palette-hit';
        hit.appendChild(shape(type));
        item.append(chip, hit);
        item.addEventListener('pointerdown', event => startNewDrag(event, type));
        item.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); quickAdd(type); }
        });
        palette.appendChild(item);
      });
    }

    function count(type) { return state.blocks.filter(block => block.type === type).length; }
    function total() { return state.blocks.reduce((sum, block) => sum + DEFS[block.type].value, 0); }
    function digits(number) {
      const padded = String(Math.max(0, number || 0)).padStart(4, '0').slice(-4);
      return { '1000': +padded[0], '100': +padded[1], '10': +padded[2], '1': +padded[3] };
    }

    function showFeedback(message = '', kind = '') {
      feedback.textContent = message;
      feedback.className = `feedback ${kind}`;
    }

    function updateSummary() {
      const value = total();
      document.getElementById('liveNumber').textContent = value.toLocaleString('zh-TW');
      TYPES.forEach(type => {
        const built = document.querySelector(`[data-built="${type}"]`);
        built.textContent = state.mode === 'challenge' ? `已放 ${count(type)} 個${DEFS[type].label}` : `${count(type)} 個${DEFS[type].label}`;
      });
      document.getElementById('emptyHint').hidden = state.blocks.length > 0;
    }

    function updateTarget() {
      const targetDigits = digits(state.target);
      TYPES.forEach(type => document.querySelector(`[data-target="${type}"]`).textContent = targetDigits[type]);
      document.getElementById('targetNumber').textContent = state.target === null ? '—' : state.target.toLocaleString('zh-TW');
    }

    function updateSelfProgress() {
      const completed = state.selfIndex + (state.selfAnswered ? 1 : 0);
      document.getElementById('selfProgressText').textContent = `第 ${Math.min(state.selfIndex + 1, 5)}／5 題`;
      document.getElementById('selfAttempts').textContent = `嘗試 ${state.selfAttempts} 次`;
      document.getElementById('progressBar').style.width = `${completed * 20}%`;
    }

    function renderBlocks() {
      workspace.querySelectorAll('.board-block').forEach(el => el.remove());
      state.blocks.forEach(block => {
        const el = document.createElement('div');
        el.className = 'board-block';
        el.dataset.id = block.id;
        el.style.left = `${block.x}px`;
        el.style.top = `${block.y}px`;
        el.style.width = `${DEFS[block.type].w}px`;
        el.style.height = `${DEFS[block.type].h}px`;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', `${block.type} 積木，拖出白板可移除`);
        el.appendChild(shape(block.type));
        el.addEventListener('pointerdown', event => startExistingDrag(event, block, el));
        workspace.appendChild(el);
      });
      updateSummary();
    }

    function canAdd(type) {
      if (count(type) >= 9) {
        showFeedback(`${DEFS[type].label}位已經有 9 個囉！可以先清除或移除一個。`, 'try');
        return false;
      }
      return true;
    }

    function nextSpot(type) {
      const rect = workspace.getBoundingClientRect();
      const n = state.blocks.length;
      const maxX = Math.max(0, rect.width - DEFS[type].w - 8);
      const maxY = Math.max(0, rect.height - DEFS[type].h - 8);
      return { x: Math.min(maxX, 18 + (n % 6) * 112), y: Math.min(maxY, 18 + Math.floor(n / 6) * 112) };
    }

    function quickAdd(type) {
      if (!canAdd(type)) return;
      state.blocks.push({ id: `b${state.nextId++}`, type, ...nextSpot(type) });
      showFeedback();
      renderBlocks();
    }

    function makeGhost(type, x, y) {
      const ghost = document.createElement('div');
      ghost.className = 'ghost';
      ghost.appendChild(shape(type));
      ghost.style.left = `${x}px`;
      ghost.style.top = `${y}px`;
      document.body.appendChild(ghost);
      return ghost;
    }

    function startNewDrag(event, type) {
      if (state.drag || !canAdd(type)) return;
      event.preventDefault();
      state.drag = { kind: 'new', type, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, x: event.clientX, y: event.clientY, ghost: makeGhost(type, event.clientX, event.clientY), moved: false };
    }

    function startExistingDrag(event, block, element) {
      if (state.drag) return;
      event.preventDefault();
      const rect = element.getBoundingClientRect();
      element.classList.add('dragging');
      state.drag = { kind: 'existing', pointerId: event.pointerId, block, element, offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top };
    }

    window.addEventListener('pointermove', event => {
      const drag = state.drag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      event.preventDefault();
      if (drag.kind === 'new') {
        drag.x = event.clientX; drag.y = event.clientY;
        drag.moved ||= Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > 7;
        drag.ghost.style.left = `${event.clientX}px`;
        drag.ghost.style.top = `${event.clientY}px`;
      } else {
        const rect = workspace.getBoundingClientRect();
        drag.block.x = event.clientX - rect.left - drag.offsetX;
        drag.block.y = event.clientY - rect.top - drag.offsetY;
        drag.element.style.left = `${drag.block.x}px`;
        drag.element.style.top = `${drag.block.y}px`;
      }
    }, { passive: false });

    function inside(rect, x, y) { return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom; }
    function clampBlock(block) {
      const rect = workspace.getBoundingClientRect();
      block.x = Math.max(0, Math.min(block.x, rect.width - DEFS[block.type].w));
      block.y = Math.max(0, Math.min(block.y, rect.height - DEFS[block.type].h));
    }

    function endDrag(event) {
      const drag = state.drag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      const rect = workspace.getBoundingClientRect();
      if (drag.kind === 'new') {
        drag.ghost.remove();
        if (inside(rect, event.clientX, event.clientY)) {
          const block = { id: `b${state.nextId++}`, type: drag.type, x: event.clientX - rect.left - DEFS[drag.type].w / 2, y: event.clientY - rect.top - DEFS[drag.type].h / 2 };
          clampBlock(block);
          state.blocks.push(block);
        } else if (!drag.moved) {
          state.blocks.push({ id: `b${state.nextId++}`, type: drag.type, ...nextSpot(drag.type) });
        }
      } else if (!inside(rect, event.clientX, event.clientY)) {
        state.blocks = state.blocks.filter(block => block.id !== drag.block.id);
      } else {
        clampBlock(drag.block);
      }
      state.drag = null;
      showFeedback();
      renderBlocks();
    }

    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    function clearBlocks() {
      state.blocks = [];
      showFeedback();
      renderBlocks();
    }

    function setMode(mode) {
      state.mode = mode;
      app.classList.toggle('challenge-mode', mode !== 'explore');
      app.classList.toggle('self-mode', mode === 'self');
      document.getElementById('challengePanel').classList.toggle('show', mode !== 'explore');
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      document.getElementById('summaryTitle').textContent = mode === 'explore' ? '積木代表的數字' : '題目定位板（大數字是題目，下方是已放積木）';
      document.getElementById('promptLead').textContent = mode === 'self' ? '自我挑戰，請用積木排出：' : '請用積木排出：';
      if (mode === 'challenge') newRandomQuestion();
      if (mode === 'self') startSelfChallenge();
      document.getElementById('nextSelfQuestion').classList.add('hidden');
      document.getElementById('checkAnswer').classList.remove('hidden');
      if (mode !== 'self') showFeedback();
      updateTarget();
      updateSummary();
    }

    function assignQuestion(number) {
      if (!Number.isInteger(number) || number < 0 || number > 9999) {
        showFeedback('請輸入 0 到 9999 的整數。', 'try');
        return;
      }
      state.target = number;
      state.blocks = [];
      document.getElementById('questionInput').value = '';
      updateTarget();
      renderBlocks();
      showFeedback(`請拖出代表 ${number.toLocaleString('zh-TW')} 的積木。`);
    }

    function newRandomQuestion() {
      let number;
      do { number = Math.floor(Math.random() * 9999) + 1; } while (String(number).includes('000'));
      assignQuestion(number);
    }

    function makeFiveQuestions() {
      const questions = new Set();
      while (questions.size < 5) questions.add(Math.floor(Math.random() * 9999) + 1);
      return [...questions];
    }

    function showSelfQuestion() {
      state.target = state.selfQuestions[state.selfIndex];
      state.blocks = [];
      state.selfAnswered = false;
      document.getElementById('checkAnswer').classList.remove('hidden');
      document.getElementById('nextSelfQuestion').classList.add('hidden');
      updateTarget();
      updateSelfProgress();
      renderBlocks();
      showFeedback('看清楚每一個位值，再拖出積木吧！');
    }

    function startSelfChallenge() {
      state.selfQuestions = makeFiveQuestions();
      state.selfIndex = 0;
      state.selfAttempts = 0;
      showSelfQuestion();
    }

    function nextSelfQuestion() {
      if (!state.selfAnswered) return;
      state.selfIndex += 1;
      if (state.selfIndex < 5) showSelfQuestion();
    }

    function assignInputQuestion() {
      const input = document.getElementById('questionInput');
      const raw = input.value.trim();
      if (raw === '') {
        showFeedback('請先輸入 0 到 9999 的題目數字。', 'try');
        input.focus();
        return;
      }
      assignQuestion(Number(raw));
    }

    function checkAnswer() {
      if (state.target === null) { showFeedback('請先指定題目或按「隨機出題」。', 'try'); return; }
      const answer = total();
      if (state.mode === 'self') {
        if (state.selfAnswered) return;
        state.selfAttempts += 1;
        updateSelfProgress();
      }
      if (answer === state.target) {
        if (state.mode === 'self') {
          state.selfAnswered = true;
          updateSelfProgress();
          document.getElementById('checkAnswer').classList.add('hidden');
          if (state.selfIndex === 4) {
            showFeedback(`太棒了！完成 5 題挑戰，共檢查 ${state.selfAttempts} 次。`, 'success');
          } else {
            document.getElementById('nextSelfQuestion').classList.remove('hidden');
            showFeedback(`第 ${state.selfIndex + 1} 題答對了！準備好就進入下一題。`, 'success');
          }
        } else {
          showFeedback(`答對了！你用積木排出了 ${answer.toLocaleString('zh-TW')}。`, 'success');
        }
      } else {
        const targetDigits = digits(state.target);
        const firstWrong = TYPES.find(type => count(type) !== targetDigits[type]);
        const hint = firstWrong ? `再看看${DEFS[firstWrong].label}位。` : '';
        showFeedback(`目前是 ${answer.toLocaleString('zh-TW')}，和題目還不一樣。${hint}`, 'try');
      }
    }

    document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    document.getElementById('resetBlocks').addEventListener('click', clearBlocks);
    document.getElementById('randomQuestion').addEventListener('click', newRandomQuestion);
    document.getElementById('checkAnswer').addEventListener('click', checkAnswer);
    document.getElementById('restartSelf').addEventListener('click', startSelfChallenge);
    document.getElementById('nextSelfQuestion').addEventListener('click', nextSelfQuestion);
    document.getElementById('setQuestion').addEventListener('click', assignInputQuestion);
    document.getElementById('questionInput').addEventListener('keydown', event => {
      if (event.key === 'Enter') assignInputQuestion();
    });

    buildPalette();
    renderBlocks();
    updateTarget();
  </script>
</body>
</html>
